<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – AuthSystem</title>
    <meta name="description" content="Sign in to your AuthSystem account securely." />

    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!-- Dark Mode Toggle -->
    <button class="dark-mode-toggle" id="darkToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
      <i class="bi bi-moon-stars-fill"></i>
    </button>

    <div class="auth-wrapper">
      <div class="auth-card card border-0 page-fade">
        <div class="card-body">

          <!-- Brand Logo -->
          <div class="brand-logo">
            <i class="bi bi-shield-lock-fill"></i>
          </div>

          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to continue to your account</p>

          <!-- Login Form -->
          <form id="loginForm" novalidate>

            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted" style="border:1.5px solid #e2e8f0;border-right:none;border-radius:0.6rem 0 0 0.6rem;">
                  <i class="bi bi-person"></i>
                </span>
                <input
                  type="text"
                  class="form-control border-start-0"
                  id="username"
                  name="username"
                  placeholder="Enter your username"
                  autocomplete="username"
                  style="border-radius:0 0.6rem 0.6rem 0;"
                  required
                />
                <div class="invalid-feedback">
                  <i class="bi bi-exclamation-circle-fill"></i> Please enter your username.
                </div>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center">
                <label for="loginPassword" class="form-label mb-0">Password</label>
                <a href="forgot-password.html" class="auth-link" style="font-size:0.8rem;">Forgot password?</a>
              </div>
              <div class="input-group mt-1">
                <input
                  type="password"
                  class="form-control"
                  id="loginPassword"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  id="toggleLoginPassword"
                  aria-label="Toggle password visibility"
                >
                  <i class="bi bi-eye" id="loginPassIcon"></i>
                </button>
                <div class="invalid-feedback">
                  <i class="bi bi-exclamation-circle-fill"></i> Please enter your password.
                </div>
              </div>
            </div>

            <!-- Remember Me -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">Remember me for 30 days</label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary-custom mb-3" id="loginBtn">
              <i class="bi bi-box-arrow-in-right me-2"></i>
              <span>Sign In</span>
            </button>

          </form>

          <div class="divider">or</div>

          <div class="text-center">
            <span class="text-muted" style="font-size:0.9rem;">Don't have an account? </span>
            <a href="register.html" class="auth-link">Create account</a>
          </div>

        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmV5YBe7gIx5v4n3efXKX58dVHs"
      crossorigin="anonymous"
    ></script>

    <script>
      // ── Dark Mode ──────────────────────────────────────────
      const darkToggle = document.getElementById('darkToggle');
      const darkIcon   = darkToggle.querySelector('i');

      function applyDarkMode(enabled) {
        document.body.classList.toggle('dark-mode', enabled);
        darkIcon.className = enabled ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        localStorage.setItem('darkMode', enabled);
      }

      darkToggle.addEventListener('click', () => {
        applyDarkMode(!document.body.classList.contains('dark-mode'));
      });

      // Check saved preference
      if (localStorage.getItem('darkMode') === 'true') applyDarkMode(true);

      // ── Password Toggle ────────────────────────────────────
      document.getElementById('toggleLoginPassword').addEventListener('click', function () {
        const input = document.getElementById('loginPassword');
        const icon  = document.getElementById('loginPassIcon');
        const isPassword = input.type === 'password';
        input.type  = isPassword ? 'text' : 'password';
        icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
      });

      // ── Form Validation + Loading Spinner ─────────────────
      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const form = this;
        const btn  = document.getElementById('loginBtn');

        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        // Show loading spinner
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border" role="status" aria-hidden="true"></span><span class="ms-2">Signing in…</span>';

        // Simulate network request, then redirect
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      });
    </script>
  </body>
</html>
