<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password – AuthSystem</title>
    <meta name="description" content="Reset your AuthSystem account password." />

    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!-- Dark Mode Toggle -->
    <button class="dark-mode-toggle" id="darkToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
      <i class="bi bi-moon-stars-fill"></i>
    </button>

    <div class="auth-wrapper">
      <div class="auth-card card border-0 page-fade">
        <div class="card-body">

          <!-- Brand Logo -->
          <div class="brand-logo">
            <i class="bi bi-envelope-paper-fill"></i>
          </div>

          <h1 class="auth-title">Forgot Password?</h1>
          <p class="auth-subtitle">No worries — we'll send you reset instructions</p>

          <!-- Info Box -->
          <div class="info-box mb-4">
            <i class="bi bi-info-circle-fill flex-shrink-0 mt-1"></i>
            <span>Enter the email address associated with your account and we will send you a password reset link.</span>
          </div>

          <!-- Form -->
          <form id="forgotForm" novalidate>

            <div class="mb-4">
              <label for="forgotEmail" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted" style="border:1.5px solid #e2e8f0;border-right:none;border-radius:0.6rem 0 0 0.6rem;">
                  <i class="bi bi-envelope"></i>
                </span>
                <input
                  type="email"
                  class="form-control border-start-0"
                  id="forgotEmail"
                  name="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  style="border-radius:0 0.6rem 0.6rem 0;"
                  required
                />
                <div class="invalid-feedback">
                  <i class="bi bi-exclamation-circle-fill"></i> Please enter a valid email address.
                </div>
              </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary-custom mb-3" id="forgotBtn">
              <i class="bi bi-send-fill me-2"></i>
              <span>Send Reset Link</span>
            </button>

          </form>

          <!-- Success State (hidden by default) -->
          <div id="successMsg" class="text-center" style="display:none;">
            <div style="font-size:3rem;margin-bottom:1rem;">📬</div>
            <h5 style="font-family:'Poppins',sans-serif;font-weight:600;color:#10b981;">Email Sent!</h5>
            <p class="text-muted" style="font-size:0.9rem;">Check your inbox for the reset link. It expires in 15 minutes.</p>
          </div>

          <div class="divider">or</div>

          <div class="text-center">
            <a href="login.html" class="auth-link d-inline-flex align-items-center gap-2">
              <i class="bi bi-arrow-left"></i> Back to Sign In
            </a>
          </div>

        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmV5YBe7gIx5v4n3efXKX58dVHs"
      crossorigin="anonymous"
    ></script>

    <script>
      // ── Dark Mode ──────────────────────────────────────────
      const darkToggle = document.getElementById('darkToggle');
      const darkIcon   = darkToggle.querySelector('i');

      function applyDarkMode(enabled) {
        document.body.classList.toggle('dark-mode', enabled);
        darkIcon.className = enabled ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        localStorage.setItem('darkMode', enabled);
      }

      darkToggle.addEventListener('click', () => {
        applyDarkMode(!document.body.classList.contains('dark-mode'));
      });

      if (localStorage.getItem('darkMode') === 'true') applyDarkMode(true);

      // ── Form Submit ────────────────────────────────────────
      document.getElementById('forgotForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const form = this;
        const btn  = document.getElementById('forgotBtn');

        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border" role="status" aria-hidden="true"></span><span class="ms-2">Sending…</span>';

        setTimeout(() => {
          form.style.display  = 'none';
          document.getElementById('successMsg').style.display = 'block';
        }, 1500);
      });
    </script>
  </body>
</html>
